<div class="main-content">
  <button (click)="display()" mat-raised-button>
    @if (isShowed()) {
      Hide list
    } @else {
      Show list
    }
  </button>
  <button (click)="add()" mat-raised-button color="primary">Ajouter</button>
  <button (click)="delete()" mat-raised-button color="warn">Supprimer</button>

  @if (isShowed()) {
    <div class="first-table">
      @for (element of list(); track $index) {
        <p appFirstDirective>{{ element | firstPipe }}</p>
        <mat-divider />
      }
    </div>
    <div class="first-table">
      @for (message of messageList(); track $index) {
        <p appFirstDirective>{{ message }} <span (click)="deleteMessage(message)">X</span></p>
        <mat-divider />
      }
    </div>
  }
</div>
<div class="main-content">
  @for (buttonName of buttonList; track buttonName) {
    <app-message-box [name]="buttonName" />
  }
</div>
